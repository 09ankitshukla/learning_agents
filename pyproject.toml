[project]
name = "learning-agents"
version = "0.1.0"
description = "Build LLM agents from scratch: one runnable agent per lesson, local open-source models by default."
# 3.12, raised from 3.11 when lesson 5 arrived: fastembed requires numpy>=2.3,
# which itself requires Python>=3.12. Worth noting the floor was only ever
# *claimed* at 3.11 -- every lesson was written and tested on 3.12, so this is
# also a correction rather than purely a new constraint.
requires-python = ">=3.12"

# Versions are pinned deliberately. This repo is a teaching artifact -- someone
# cloning it in a year should get the same behaviour you got. If resolution ever
# fails on a new platform, relax the pin for that single package and note it.
dependencies = [
    "openai==1.54.4",        # used as a *generic* OpenAI-compatible HTTP client
    "anthropic==0.39.0",     # only needed for the Anthropic provider
    "pydantic==2.9.2",       # schema validation for structured model output
    "python-dotenv==1.0.1",  # loads .env so no keys ever live in code
    "rich==13.9.4",          # readable terminal output while you learn
    "httpx==0.27.2",         # pinned explicitly: shared by both SDKs, used directly in lesson 12
    "tzdata==2024.2",        # Windows ships no IANA tz database, so zoneinfo needs this
]

[project.optional-dependencies]
# Lesson 5 (retrieval) only. Kept optional so lessons 0-4 install without them.
#
# fastembed rather than sentence-transformers on purpose: it runs the embedding
# model through ONNX, so it needs no PyTorch. That is a ~30 MB quantised model
# download instead of a multi-hundred-MB torch wheel, and it is fast on CPU --
# measured 0.02s to embed three texts on this machine, with no GPU.
#
# Groq serves no embedding models (verified: chat, safety and speech only), so
# embeddings have to run locally whichever library you pick.
retrieval = [
    "fastembed==0.8.1",
    "numpy==2.5.3",
]

dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmkit"]

[tool.pytest.ini_options]
testpaths = ["lessons"]
python_files = ["test_*.py"]
